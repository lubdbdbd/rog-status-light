name: Windows build and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'ROGStatusLight.spec'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test software and publishing rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Choose release version
        id: version
        run: python scripts/release_version.py
      - name: Build Windows installer archive
        run: python scripts/build_release.py --version '${{ steps.version.outputs.version }}'
      - name: Publish complete release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py '${{ steps.version.outputs.version }}'
